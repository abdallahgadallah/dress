services:
  - type: web
    name: magic-fashion
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn dress_shop.wsgi:application"
    envVars:
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: magic-fashion-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: magic-fashion-db
    databaseName: magic_fashion
    user: magic_fashion_user
    plan: basic-256mb
