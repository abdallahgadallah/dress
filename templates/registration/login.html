<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #fff7ef 0%, #f7f2eb 45%, #efe2d4 100%);
        }

        .login-card {
            width: min(460px, 92vw);
            background: rgba(255, 253, 249, 0.95);
            border: 1px solid rgba(156, 79, 50, 0.12);
            border-radius: 24px;
            box-shadow: 0 18px 45px rgba(84, 49, 31, 0.09);
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 class="fw-bold mb-2">Magic Fashion</h1>
        <p class="text-muted mb-4">سجل دخولك للوصول إلى النظام.</p>
        {% if form.errors %}
            <div class="alert alert-danger">اسم المستخدم أو كلمة المرور غير صحيحة.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">اسم المستخدم</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">دخول</button>
        </form>
    </div>
</body>
</html>
