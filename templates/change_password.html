{% extends "base.html" %}

{% block title %}تغيير كلمة المرور{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="panel-card">
            <h1 class="fw-bold mb-4">تغيير كلمة المرور</h1>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">كلمة المرور الحالية</label>
                    {{ form.old_password }}
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور الجديدة</label>
                    {{ form.new_password1 }}
                </div>
                <div class="mb-3">
                    <label class="form-label">تأكيد كلمة المرور الجديدة</label>
                    {{ form.new_password2 }}
                </div>
                {% if form.errors %}
                    <div class="alert alert-danger">تأكد من البيانات المدخلة.</div>
                {% endif %}
                <button type="submit" class="btn btn-primary">حفظ كلمة المرور</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
